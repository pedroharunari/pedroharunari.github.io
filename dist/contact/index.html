</div> </footer> <script>
  /* Fade-in observer — runs on every page */
  const obs = new IntersectionObserver(
    es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
    { threshold: 0.05 }

  document.querySelectorAll('.fade-in').forEach((el, i) => {
